    @keyframes br { 0%, 100% { scale: 1; } 50% { scale: 1.035; } }
    @keyframes sl { from { left: -40%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { .lm, .lm .l, .lb::after { animation: none; } .lm .l { -webkit-mask-image: none; mask-image: none; } .lm .g { display: none; } }
  </style>
</head>
<body>
  <div class="loader" role="status" aria-label="Loading">
    <div class="lm" aria-hidden="true"><i class="g"></i><i class="l"></i></div>
    <div class="lw" role="img" aria-label="Clover-X"></div>
    <p class="ll">Loading…</p>
    <div class="lb" aria-hidden="true"></div>
  </div>
  <main>
    <p class="k">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for has moved or no longer exists.</p>
    <a href="/" id="home">Back to the homepage</a>
  </main>
  <script>
    // On a GitHub project site (user.github.io/repo/) the homepage is the first path segment.
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
    // Loader: hide 2 seconds after the page started loading.
    setTimeout(function () { var l = document.querySelector('.loader'); l.classList.add('is-done'); l.setAttribute('aria-hidden', 'true'); }, Math.max(0, 2000 - performance.now()));
  </script>
</body>
</html>
