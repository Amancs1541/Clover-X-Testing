<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Clover-X</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f2b36">
  <!-- Self-contained on purpose: GitHub Pages can show this page at any address, so it does not rely on relative file paths. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #0f2b36; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; }
    p.k { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: #5cd0c2; margin: 0; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 12px 0; font-weight: 600; }
    p { color: #b6c9cf; margin: 0 0 32px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #5cd0c2; color: #0f2b36; font-weight: 600; text-decoration: none; }
    a:hover { background: #7adcd0; }
    a:focus-visible { outline: none; box-shadow: 0 0 0 2px #0f2b36, 0 0 0 4.5px #5cd0c2; }
  </style>
</head>
<body>
  <main>
    <p class="k">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for has moved or no longer exists.</p>
    <a href="/" id="home">Back to the homepage</a>
  </main>
  <script>
    // On a GitHub project site (user.github.io/repo/) the homepage is the first path segment.
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
