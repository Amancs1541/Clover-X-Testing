<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clover-X Loader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: a centered loading screen (sweeping highlight travels around the real clover mark over a faint ghost of it), with compact spinner sizes in a row beneath. */
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
:root {
  --paper: #FFFFFF;
  --panel: #F4F7F7;
  --ink: #163944;
  --muted: #5B7680;
  --accent: #2F7F78;
  --hair: #D7E2E4;
  --ghost: .14;
  --mark-filter: none;
  --display: "Outfit", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C242D; --panel: #12303B; --ink: #F2F7F7; --muted: #93B2BA; --accent: #5CD0C2; --hair: #25444F;
    --ghost: .16; --mark-filter: brightness(0) invert(1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C242D; --panel: #12303B; --ink: #F2F7F7; --muted: #93B2BA; --accent: #5CD0C2; --hair: #25444F;
  --ghost: .16; --mark-filter: brightness(0) invert(1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--display);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }

.screen {
  background: var(--panel);
  border-radius: 20px;
  min-height: 520px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 30px; padding: 48px 16px;
}

/* the mark: ghost underneath, travelling highlight on top */
.mark { position: relative; aspect-ratio: 315 / 303; width: var(--s, 200px); flex: none; }
.mark img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  filter: var(--mark-filter);
}
.mark .ghost { opacity: var(--ghost); }
.mark .lit {
  --a: 0deg;
  -webkit-mask-image: conic-gradient(from var(--a) at 44% 56%, transparent 0deg, #000 70deg, #000 110deg, transparent 190deg, transparent 360deg);
  mask-image: conic-gradient(from var(--a) at 44% 56%, transparent 0deg, #000 70deg, #000 110deg, transparent 190deg, transparent 360deg);
  animation: sweep 2.2s linear infinite;
}
.screen .mark { animation: breathe 2.2s ease-in-out infinite; }

.word { width: min(260px, 64vw); height: auto; display: block; filter: var(--mark-filter); opacity: .92; }

.status { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.label { font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; }
.label .dots { display: inline-flex; width: 1.6em; }
.label .dots i { font-style: normal; opacity: 0; animation: dot 1.5s infinite; }
.label .dots i:nth-child(2) { animation-delay: .25s; }
.label .dots i:nth-child(3) { animation-delay: .5s; }
.bar { width: 168px; height: 3px; border-radius: 2px; background: var(--hair); overflow: hidden; position: relative; }
.bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: var(--accent); animation: slide 1.4s cubic-bezier(.5,0,.3,1) infinite; }

.compact { display: flex; flex-direction: column; gap: 16px; }
.compact h2 { margin: 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sizes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 40px; padding: 28px; background: var(--panel); border-radius: 16px; }
.sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sizes figcaption { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.btn {
  display: inline-flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 22px;
  font: 600 15px/1 var(--display); color: var(--paper); background: var(--ink);
  border: 0; border-radius: 999px;
}
.btn .mark { --s: 22px; }
.btn .mark img { filter: var(--btn-filter, brightness(0) invert(1)); }
:root[data-theme="dark"] .btn .mark img { --btn-filter: none; filter: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn .mark img { filter: none; } }
.btn .mark .ghost { opacity: .3; }

@keyframes sweep { to { --a: 360deg; } }
@keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.035; } }
@keyframes dot { 0%, 20% { opacity: 0; } 40%, 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes slide { from { left: -40%; } to { left: 100%; } }

@media (prefers-reduced-motion: reduce) {
  .mark .lit { animation: none; -webkit-mask-image: none; mask-image: none; }
  .mark .ghost { display: none; }
  .screen .mark { animation: none; }
  .label .dots i { animation: none; opacity: 1; }
  .bar::after { animation: none; left: 0; width: 100%; opacity: .5; }
}
</style>
